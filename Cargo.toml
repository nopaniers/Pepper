[package]
name = "pepper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Pepper programming language compiler"
publish = false

[lib]
name = "pepper"
path = "src/lib.rs"

[[bin]]
name = "pepper"
path = "src/main.rs"

[dependencies]
inkwell = { version = "=0.11.0", default-features = false, features = ["llvm19-1-force-dynamic", "target-x86", "target-aarch64"] }
tempfile = "3.23"

[workspace]
members = ["runtime"]
default-members = [".", "runtime"]
resolver = "3"
